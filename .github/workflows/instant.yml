name: instant
on:
  repository_dispatch:
    types: [draft, publish]
permissions:
  contents: write
  models: read
concurrency:
  group: instant-${{ github.event.action }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow requests
      - name: run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "ItalBridge bot"
          git config user.email "bot@users.noreply.github.com"
          python3 bot/instant.py ${{ github.event.action }}
